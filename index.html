<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-title" content="MaFozok">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.svg">
<title>MaFozok</title>
<style>
  :root { color-scheme: light; --bg: #fff; --fg: #1c1c1e; --muted: #8e8e93; --soft: #f2f2f4; --line: #e5e5ea; --accent: #e03131; }
  * { box-sizing: border-box; }
  .i { width: 1.1em; height: 1.1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.2em; }
  body { --w: 1400px; margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.5 -apple-system, system-ui, sans-serif; }
  body.detail { --w: 640px; }
  header { position: sticky; top: 0; z-index: 1; display: flex; gap: 12px; align-items: center;
    padding: calc(env(safe-area-inset-top) + 12px) max(16px, calc((100% - var(--w)) / 2 + 16px)) 12px; background: var(--bg); border-bottom: 1px solid var(--line); }
  .btn { font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 10px 18px; text-decoration: none;
    background: var(--accent); color: #fff; cursor: pointer; display: flex; gap: 6px; align-items: center; }
  #hello { font-size: 22px; }
  .btn > span { text-box: trim-both cap alphabetic; } /* centres the capital letters on the icon, whatever the font's metrics */
  #lucky, #share { margin-left: auto; }
  #lucky { padding: 12px; }
  #share { gap: 10px; } /* the share icon fills its box, the chevron doesn't, so it needs a wider gap to look evenly spaced */
  #back, #share { min-height: 46px; } /* the trimmed label no longer sets the height, so keep the original pill size */
  #back, #share, body.detail #hello, body.detail #lucky { display: none; }
  body.detail #back, body.detail #share { display: flex; }
  #toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 24px); transform: translate(-50%, 12px);
    background: var(--fg); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 15px;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  main { max-width: var(--w); margin: 0 auto; padding: 16px 16px calc(env(safe-area-inset-bottom) + 32px); }

  .list { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 16px; }
  .list a { display: block; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
    color: inherit; text-decoration: none; }
  .list span { display: block; padding: 12px 16px; font-size: 19px; font-weight: 600; }
  .list img, .list .noimg { aspect-ratio: 4 / 3; }
  .search { position: relative; display: block; margin: 0 0 16px; }
  .search .i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .search input { width: 100%; font: inherit; color: var(--fg); background: var(--soft); border: 0; border-radius: 999px;
    padding: 12px 16px 12px 44px; outline: none; -webkit-appearance: none; appearance: none; }
  .search input:focus { box-shadow: 0 0 0 2px var(--accent); }
  .empty { color: var(--muted); }

  img { display: block; width: 100%; object-fit: cover; }
  .noimg { display: grid; place-items: center; width: 100%; font-size: 40px; color: var(--muted); background: var(--soft); }
  .noimg .i { stroke-width: 1.5; }
  .gallery { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; border-radius: 14px; margin: 0 0 12px; }
  .gallery > * { flex: 0 0 100%; aspect-ratio: 4 / 3; scroll-snap-align: start; }

  h1 { margin: 0; font-size: 28px; line-height: 1.2; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 24px 0 8px; }
  .meta { color: var(--muted); margin: 6px 0 0; display: flex; gap: 16px; }
  ul.ing { list-style: none; padding: 0; margin: 0; }
  ul.ing li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); }
  ul.ing b { font-weight: 500; color: var(--muted); }
  .chips { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .chips li { border-radius: 999px; padding: 4px 12px; background: var(--soft); }
  ol { padding-left: 22px; margin: 0; }
  ol li { margin-bottom: 14px; }
  .fn { border: 0; background: none; color: var(--accent); padding: 0 0 0 6px; cursor: pointer; font: inherit; }
  figure { margin: 0 0 16px; scroll-margin-top: 90px; }
  figure img { border-radius: 14px; }
  figcaption { color: var(--muted); font-size: 14px; margin-top: 6px; }
  ol li::marker { color: var(--accent); font-weight: 600; }
  .note { margin: 6px 0 0; padding: 6px 10px; font-size: 15px; border-left: 2px solid var(--accent);
    background: var(--soft); border-radius: 0 8px 8px 0; color: var(--muted); }
</style>
</head>
<body>
<header>
  <a id="back" class="btn" href="#"><svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg><span>Receptek</span></a>
  <h1 id="hello">Szia, mit főzöl ma?</h1>
  <button id="lucky" class="btn" aria-label="Véletlen recept"><svg class="i" viewBox="0 0 24 24"><path d="m18 14 4 4-4 4"/><path d="m18 2 4 4-4 4"/><path d="M2 18h2a4 4 0 0 0 3.3-1.7l5.4-7.6A4 4 0 0 1 16 7h6"/><path d="M2 6h2a4 4 0 0 1 3.3 1.7l.5.7"/><path d="M22 18h-6a4 4 0 0 1-3.3-1.8l-.4-.5"/></svg></button>
  <button id="share" class="btn" title="Link másolása"><svg class="i" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4"/><path d="m15.4 6.5-6.8 4"/></svg><span>Megosztás</span></button>
</header>
<main id="app"></main>
<div id="toast" role="status"></div>
<script>
  const app = document.getElementById('app');
  let recipes = [];
  let wakeLock = null;

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const icon = d => `<svg class="i" viewBox="0 0 24 24">${d}</svg>`;
  const ICONS = {
    plate: '<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
    camera: '<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  };

  // search: case/accent-insensitive, fzf-style fuzzy (the typed letters must appear in order inside a word: "cske" finds "csirke")
  let query = '';
  const words = s => String(s).toLowerCase().normalize('NFD').replace(/\p{M}/gu, '').split(/[^a-z0-9]+/).filter(Boolean);
  const subseq = (t, w) => { let i = 0; for (const c of w) if (c === t[i]) i++; return i === t.length; };
  const textOf = r => [r.name, ...Object.entries(r.ingredients ?? {}).flat(), ...(r.spices ?? []), ...(r.tags ?? []), ...r.steps.flat()].join(' ');
  // lower is better: the name beats other text, an exact substring beats scattered letters; null = no match
  const score = (r, ts) => {
    let total = 0;
    for (const t of ts) {
      const hit = (ws, base) => ws.some(w => w.includes(t)) ? base : ws.some(w => subseq(t, w)) ? base + 1 : null;
      const s = hit(r._n, 0) ?? hit(r._w, 2);
      if (s === null) return null;
      total += s;
    }
    return total;
  };
  const find = q => {
    const ts = words(q);
    if (!ts.length) return recipes;
    return recipes.map(r => [r, score(r, ts)]).filter(([, s]) => s !== null).sort((a, b) => a[1] - b[1]).map(([r]) => r);
  };
  const pics = (r, n) => r.images?.length
    ? r.images.slice(0, n).map(i => `<img src="${esc(i)}" alt="" loading="lazy">`).join('')
    : `<div class="noimg">${icon(ICONS.plate)}</div>`;

  function list() {
    app.innerHTML = `<label class="search">${icon(ICONS.search)}<input id="q" type="search" placeholder="Keresés" aria-label="Keresés"
      value="${esc(query)}" autocomplete="off" autocapitalize="off" enterkeyhint="search"></label><div id="results"></div>`;
    const q = document.getElementById('q');
    q.oninput = () => { query = q.value; results(); };
    results();
  }

  function results() {
    const found = find(query);
    document.getElementById('results').innerHTML = found.length
      ? `<ul class="list">${found.map(r => `<li><a href="#${esc(r.id)}">${pics(r, 1)}<span>${esc(r.name)}</span></a></li>`).join('')}</ul>`
      : '<p class="empty">Nincs ilyen recept.</p>';
  }

  function show(r) {
    const meta = [r.time && `<span>${icon(ICONS.clock)} ${esc(r.time)} perc</span>`,
                  r.portions && `<span>${icon(ICONS.user)} ${esc(r.portions)} adag</span>`].filter(Boolean).join('');
    // a step is "text" or ["text", "note", ...]
    // no process photos → repeat the cover photo at the bottom, captioned "after the last step"
    const proc = r.process?.length ? r.process : r.images?.length ? [{ src: r.images[0], step: r.steps.length }] : [];
    const steps = r.steps.map((s, i) => {
      const [text, ...notes] = [].concat(s);
      // footnote: camera button that scrolls to the process photo taken after this step
      const fn = proc.map((p, j) => p.step === i + 1
        ? `<button class="fn" aria-label="Fotó" onclick="document.getElementById('p${j}').scrollIntoView({behavior:'smooth'})">${icon(ICONS.camera)}</button>` : '').join('');
      return `<li>${esc(text)}${fn}${notes.map(n => `<p class="note">${esc(n)}</p>`).join('')}</li>`;
    }).join('');
    const photos = proc.map((p, j) =>
      `<figure id="p${j}"><img src="${esc(p.src)}" alt="" loading="lazy"><figcaption>${icon(ICONS.camera)} ${esc(p.label ?? `${p.step}. lépés után`)}</figcaption></figure>`).join('');
    app.innerHTML = `
      <div class="gallery">${pics(r)}</div>
      <h1>${esc(r.name)}</h1>
      ${meta ? `<div class="meta">${meta}</div>` : ''}
      <h2>Hozzávalók</h2>
      <ul class="ing">${Object.entries(r.ingredients).map(([k, v]) => `<li>${esc(k)} <b>${esc(v)}</b></li>`).join('')}</ul>
      ${r.spices?.length ? `<h2>Fűszerek</h2><ul class="chips">${r.spices.map(s => `<li>${esc(s)}</li>`).join('')}</ul>` : ''}
      <h2>Lépések</h2>
      <ol>${steps}</ol>
      ${photos ? `<h2>Folyamat</h2>${photos}` : ''}`;
  }

  // keep the screen on while a recipe is open; the OS drops the lock when the app is hidden
  async function lock() {
    if (wakeLock || !('wakeLock' in navigator)) return;
    try { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.onrelease = () => wakeLock = null; } catch {}
  }

  function route() {
    const r = recipes.find(r => r.id === location.hash.slice(1));
    document.body.classList.toggle('detail', !!r);
    if (r) { show(r); lock(); } else { list(); wakeLock?.release(); }
    scrollTo(0, 0);
  }

  document.getElementById('lucky').onclick = () => {
    const found = find(query); // draws only from what the search currently shows
    if (!found.length) return;
    let last = null;
    try { last = localStorage.getItem('last'); } catch {}
    const pool = found.length > 1 ? found.filter(r => r.id !== last) : found;
    const pick = pool[Math.floor(Math.random() * pool.length)];
    try { localStorage.setItem('last', pick.id); } catch {}
    location.hash = pick.id;
  };

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => t.classList.remove('show'), 1600);
  }

  // copies the link of the recipe's share page (index.html in its photo folder, made by make-share-pages.mjs) so chat
  // apps show its photo + name; a recipe without photos shares the plain #link
  document.getElementById('share').onclick = async () => {
    const dir = recipes.find(r => r.id === location.hash.slice(1))?.images?.[0]?.replace(/[^/]+$/, '');
    const url = dir ? new URL(dir, location.href).href : location.href;
    try { await navigator.clipboard.writeText(url); toast('Link másolva'); } catch { prompt('Másold ki a linket:', url); }
  };

  addEventListener('hashchange', route);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && document.body.classList.contains('detail')) lock();
  });

  navigator.serviceWorker?.register('sw.js');

  fetch('recipes.json', { cache: 'no-cache' })
    .then(r => r.json())
    .then(data => {
      recipes = data;
      recipes.forEach(r => { r._n = words(r.name); r._w = words(textOf(r)); });
      route();
    })
    .catch(() => app.textContent = 'Nem sikerült betölteni a recepteket.');
</script>
</body>
</html>
